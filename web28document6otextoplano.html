<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function leerFicheroTexto() {
            //vamos a decirle la ruta de nuestro fichero
            let path = "documents/notas.txt";
            console.log("pidiendo datos")
            //con fetch leemos los datos del fichero que me va a dar una respuesta
            //debemos indicar que espere a una respuesta
            let response = await fetch(path);
            //tenemos que convertir la respuesta a un formato ya sea
            //xml, etc
            console.log("Convirtiendo datos")
            //puede tardar tiempo en convertir los datos
            //de la repsuesta
            let datos = await response.text();
            //ya tenemos el contenido del fichero
            console.log(datos);
            console.log("fin de lectura");
            //dibujamos los datos dentro del resultado
            let resultado = document.getElementById("resultado");
            resultado.innerText = datos;
        }
    </script>
</head>
<body>
    <h1>Leer documento texto plano</h1>
    <button onclick="leerFicheroTexto()">Leer texto plano</button>
    <p id="resultado" style="color:red"></p>
</body>
</html>

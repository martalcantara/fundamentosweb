<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function ejecutarBucleFor(){
            // se inicia en un numero y debemos indicar hasta que el numero finaliza
            // y cuanto suma
            //inicio = 4, hasta 8, de uno en uno
            let texto = ""; 
            for (let i = 1; i <= 8; i++) {
                // guardamos en la variable texto el valor de i: 1, 2, 3, 4...
                texto += i + ", " ;
                
            }
           // recuperamos el resultado
           let resultado = document.getElementById("resultado");
              resultado.innerText = texto;
        }
        
        function ejecutarBucleWhile(){
            // ESTOS BUCLES SON IGUALES, SOLO QUE LA CONDICION 
            // QUE LE PONGAMOS NO SABEMOS CUANDO SE CUMPLIRÁ
            //para este bucle necesito una variable para la condición
            let contador = 1;
            //mientras que contador no llegue a 14, hacemos instrucciones
            let texto = "";
            while (contador <= 14) {
                //guardaremos en el texto el contador
                texto += contador + ", ";
                // debemos modificar la variable de la condición
                contador += 1 ;
            }
           let resultado = document.getElementById("resultado");
              resultado.innerText = texto;
        }
            
    </script>
</head>
<body>
    <h1>Ejemplos Sintaxis de bucles</h1>
    <button onclick="ejecutarBucleFor()">Ejecutar for</button>
    <button onclick="ejecutarBucleWhile()">Ejecutar while</button>
    <p id="resultado"></p>
</body>
</html>

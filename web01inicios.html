<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos web</title>
    <script>
        function showAlert() {
            // Muestra una alerta al usuario cuando se hace clic en el encabezado
            alert("¡Bienvenido a la página de Fundamentos web!");
            console.log("Alerta mostrada al usuario.");
        }

    </script>
</head>
<body>
    <h1 onclick="showAlert()">Fundamentos web</h1>

        Estos elementos permiten crear páginas accesibles 
        y funcionales que se visualizan en un navegador.</p>
</body>
</html>

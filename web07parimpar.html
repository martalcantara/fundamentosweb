<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarNumero(){  
            // LA DECLARACIÓN DE LA VARIABLE
            // PARA TRABAJAR
            let numero = 14;
            //necesito saber si el numero es par o impar
            if(numero % 2 == 0){
                alert("El número es par");
            } else {
                alert("El número es impar");
            }
        }
    </script>
</head>
<body>
    <h1>Ejemplo par/impar</h1>
    <button onclick="evaluarNumero()">
        Evaluar número
    </button>
</body>
</html>
